name: Feature request
description: Propose a new capability or a change to an existing one.
title: "[Feature]: "
labels: ["enhancement", "status:needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        QuickEx is self-custodial. Proposals that introduce an intermediary
        holding user funds are out of scope by design, not by policy oversight.

  - type: dropdown
    id: surface
    attributes:
      label: Which surface does this touch?
      options:
        - app/frontend (Next.js web)
        - app/backend (NestJS API)
        - app/mobile (Expo app)
        - app/contract (Soroban Rust)
        - Cross-cutting / don't know
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't a user do today? Describe the situation, not the solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: The smallest change that solves the problem. Avoid speculative scope.
    validations:
      required: true

  - type: dropdown
    id: status
    attributes:
      label: Is this flow currently Live, Partial, or Mocked?
      description: See docs/CAPABILITY-MAP.md. Wiring up an existing backend endpoint is the highest-leverage kind of PR here.
      options:
        - Live today — I want to extend or change it
        - Partial — a segment is missing or broken
        - Mocked — the UI/API shape exists but nothing real happens
        - Experimental — feature-flagged or testnet-only
        - Not in the codebase yet
    validations:
      required: true

  - type: textarea
    id: contract
    attributes:
      label: API contract impact
      description: New or changed endpoints, request/response shapes, and error codes. Note any new idempotency or auth requirement.
      placeholder: |
        POST /payments — 201 on success, 409 on duplicate idempotency key
    validations:
      required: false

  - type: textarea
    id: financial-impact
    attributes:
      label: Financial or custody impact
      description: |
        Does this touch settlement, key handling, fees, or refunds? If so, name
        the invariant from docs/INVARIANTS.md (INV-01..INV-10) it could affect.
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and discussions for duplicates.
        - label: I read docs/CAPABILITY-MAP.md and this is not already Live.
        - label: This does not require an intermediary to hold user funds.
        - label: If this is architectural, I am prepared to add an ADR in `docs/adr/`.
