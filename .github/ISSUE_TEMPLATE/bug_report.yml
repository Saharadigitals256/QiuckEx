name: Bug report
description: Something in QuickEx behaves differently from what the docs say it does.
title: "[Bug]: "
labels: ["bug", "status:needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. Please do **not** include secret keys, mnemonic
        phrases, live JWTs, or real user data — the repo runs a secret scan
        (`.secrets.baseline`) and anything you paste may be rotated out from
        under you. Use Stellar testnet accounts only.

  - type: textarea
    id: surface
    attributes:
      label: Which surface is affected?
      options:
        - app/frontend (Next.js web)
        - app/backend (NestJS API)
        - app/mobile (Expo app)
        - app/contract (Soroban Rust)
        - CI / tooling
        - Docs only
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you observed, including the exact error message or response body.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: |
        1.
        2.
        3.
      placeholder: |
        1. Open /pay/username with amount=10
        2. ...
    validations:
      required: true

  - type: input
    id: network
    attributes:
      label: Stellar network
      description: testnet or mainnet. Almost everything should be testnet.
      placeholder: testnet
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Commit SHA or release version
      description: Output of `git rev-parse --short HEAD` in your checkout, or the version tag.
    validations:
      required: true

  - type: textarea
    id: env
    attributes:
      label: Relevant configuration
      description: Node/pnpm versions, `STELLAR_NETWORK`, feature flags you changed. Redact all values.
      render: shell
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Structured logs are preferred. Scrub public keys and any token.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for duplicates.
        - label: This is reproducible on testnet.
        - label: I did not paste any secret key, mnemonic, or live credential.
        - label: If this touches funds, signing, or settlement, I labeled it `custody:sensitive`.
