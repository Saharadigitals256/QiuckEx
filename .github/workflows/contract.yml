name: Contract CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'app/contract/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'app/contract/**'

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/contract

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false

      - name: Install root dependencies
        working-directory: .
        run: pnpm install --no-frozen-lockfile

      - name: Check cross-network contract metadata drift
        working-directory: .
        run: pnpm check:contract-metadata-drift && node --test scripts/check-contract-metadata-drift.test.js

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "app/contract"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test