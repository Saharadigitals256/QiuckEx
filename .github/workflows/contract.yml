name: Contract CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'app/contract/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'app/contract/**'

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/contract

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "app/contract"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Enforce contract CPU, memory, and storage regression budgets
        run: cargo test -p quickex bench_core_lifecycle_costs -- --nocapture
        env:
          QUICKEX_BENCH_ARTIFACT_DIR: target/quickex-budget-report

      - name: Upload contract budget report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quickex-contract-budget-report
          path: app/contract/target/quickex-budget-report/
          if-no-files-found: ignore

      - name: Run tests
        run: cargo test